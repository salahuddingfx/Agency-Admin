      <stop offset="0%" stop-color="#18B7F5" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <mask id="fav-mask-admin">
      <circle cx="50" cy="50" r="40" fill="#FFFFFF" />
